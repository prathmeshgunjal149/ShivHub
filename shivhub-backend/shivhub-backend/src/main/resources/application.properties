# =========================================================
# SHIVHUB BACKEND - APPLICATION CONFIGURATION
# =========================================================

spring.application.name=shivhub-backend

# Optional local overrides (credentials and machine-specific settings).
# Copy application-local.properties.example to application-local.properties.
spring.config.import=optional:file:./application-local.properties


# =========================================================
# MYSQL DATABASE
# =========================================================

spring.datasource.url=${SHIVHUB_DB_URL:jdbc:mysql://localhost:3306/shivhub}
spring.datasource.username=${SHIVHUB_DB_USERNAME:root}
spring.datasource.password=${SHIVHUB_DB_PASSWORD:root}


# =========================================================
# JPA / HIBERNATE
# =========================================================

spring.jpa.hibernate.ddl-auto=update

# Razorpay credentials come exclusively from the environment. Leave unset to
# keep the payment gateway disabled in local development.
razorpay.key-id=${RAZORPAY_KEY_ID:}
razorpay.key-secret=${RAZORPAY_KEY_SECRET:}
razorpay.webhook-secret=${RAZORPAY_WEBHOOK_SECRET:}
spring.jpa.show-sql=${SHIVHUB_JPA_SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=${SHIVHUB_JPA_FORMAT_SQL:false}


# =========================================================
# JWT CONFIGURATION
# =========================================================

jwt.secret=${SHIVHUB_JWT_SECRET:ShivHubLocalDevJwtSecretChangeBeforeProduction2026Secure}
jwt.expiration=${SHIVHUB_JWT_EXPIRATION:86400000}


# =========================================================
# FILE UPLOAD CONFIGURATION
# =========================================================

spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=60MB


# =========================================================
# SERVER CONFIGURATION
# =========================================================

# 8080 is already occupied on this development machine. Override with
# SHIVHUB_SERVER_PORT when another environment needs a different port.
server.port=${SHIVHUB_SERVER_PORT:8081}

# Comma-separated frontend origins allowed to call the API. Set the deployed
# HTTPS website URL through SHIVHUB_CORS_ALLOWED_ORIGINS in production.
shivhub.cors.allowed-origins=${SHIVHUB_CORS_ALLOWED_ORIGINS:http://localhost:5173}

# Public HTTPS API base URL used by HTML email banners for /uploads/campaigns/... images.
# Configure SHIVHUB_PUBLIC_API_URL after deployment; a customer's mail client cannot load a private localhost URL.
shivhub.public-api-url=${SHIVHUB_PUBLIC_API_URL:http://localhost:8081}

# Enable only with a real provider endpoint, token and registered sender.
shivhub.whatsapp.enabled=${SHIVHUB_WHATSAPP_ENABLED:false}
shivhub.whatsapp.provider-url=${SHIVHUB_WHATSAPP_PROVIDER_URL:}
shivhub.whatsapp.token=${SHIVHUB_WHATSAPP_TOKEN:}
shivhub.whatsapp.sender=${SHIVHUB_WHATSAPP_SENDER:}
shivhub.whatsapp.meta-template-name=${SHIVHUB_WHATSAPP_META_TEMPLATE_NAME:}
shivhub.whatsapp.meta-otp-template-name=${SHIVHUB_WHATSAPP_META_OTP_TEMPLATE_NAME:}
shivhub.whatsapp.meta-template-language=${SHIVHUB_WHATSAPP_META_TEMPLATE_LANGUAGE:en_US}
shivhub.whatsapp.otp-expiry-minutes=${SHIVHUB_WHATSAPP_OTP_EXPIRY_MINUTES:5}
shivhub.whatsapp.otp-resend-seconds=${SHIVHUB_WHATSAPP_OTP_RESEND_SECONDS:60}
shivhub.whatsapp.otp-max-attempts=${SHIVHUB_WHATSAPP_OTP_MAX_ATTEMPTS:5}

# WhatsApp provider migration. Keep `meta` until all AiSensy API campaigns are
# approved, LIVE and tested. Switch only through environment configuration.
shivhub.whatsapp.provider=${SHIVHUB_WHATSAPP_PROVIDER:meta}

# AiSensy uses a LIVE API campaign name (not merely an approved template name).
# Store the API key in the environment only. Empty campaign names safely skip
# that event, so enabling AiSensy cannot send a template with wrong parameters.
shivhub.whatsapp.aisensy.enabled=${AISENSY_ENABLED:false}
shivhub.whatsapp.aisensy.api-key=${AISENSY_API_KEY:}
shivhub.whatsapp.aisensy.api-url=${AISENSY_API_URL:https://backend.aisensy.com/campaign/t1/api/v2}
shivhub.whatsapp.aisensy.source=${AISENSY_SOURCE:ShivHub Backend}

# Fill these with the exact LIVE AiSensy API campaign names after template approval.
# Parameter order is owned by the matching template/API campaign; do not enable
# a campaign until its template variables have been mapped and tested.
shivhub.whatsapp.aisensy.campaigns.generic-notification=${AISENSY_CAMPAIGN_GENERIC_NOTIFICATION:}
shivhub.whatsapp.aisensy.campaigns.otp-registration=${AISENSY_CAMPAIGN_OTP_REGISTRATION:}
shivhub.whatsapp.aisensy.campaigns.otp-login=${AISENSY_CAMPAIGN_OTP_LOGIN:}
shivhub.whatsapp.aisensy.campaigns.password-reset=${AISENSY_CAMPAIGN_PASSWORD_RESET:}
shivhub.whatsapp.aisensy.campaigns.order-placed=${AISENSY_CAMPAIGN_ORDER_PLACED:}
shivhub.whatsapp.aisensy.campaigns.order-confirmed=${AISENSY_CAMPAIGN_ORDER_CONFIRMED:}
shivhub.whatsapp.aisensy.campaigns.order-processing=${AISENSY_CAMPAIGN_ORDER_PROCESSING:}
shivhub.whatsapp.aisensy.campaigns.order-packed=${AISENSY_CAMPAIGN_ORDER_PACKED:}
shivhub.whatsapp.aisensy.campaigns.order-shipped=${AISENSY_CAMPAIGN_ORDER_SHIPPED:}
shivhub.whatsapp.aisensy.campaigns.order-out-for-delivery=${AISENSY_CAMPAIGN_ORDER_OUT_FOR_DELIVERY:}
shivhub.whatsapp.aisensy.campaigns.order-delivered=${AISENSY_CAMPAIGN_ORDER_DELIVERED:}
shivhub.whatsapp.aisensy.campaigns.order-cancelled=${AISENSY_CAMPAIGN_ORDER_CANCELLED:}
shivhub.whatsapp.aisensy.campaigns.invoice-generated=${AISENSY_CAMPAIGN_INVOICE_GENERATED:}
shivhub.whatsapp.aisensy.campaigns.payment-success=${AISENSY_CAMPAIGN_PAYMENT_SUCCESS:}
shivhub.whatsapp.aisensy.campaigns.coupon-applied=${AISENSY_CAMPAIGN_COUPON_APPLIED:}
shivhub.whatsapp.aisensy.campaigns.payment-reminder=${AISENSY_CAMPAIGN_PAYMENT_REMINDER:}
shivhub.whatsapp.aisensy.campaigns.refund-completed=${AISENSY_CAMPAIGN_REFUND_COMPLETED:}
shivhub.whatsapp.aisensy.campaigns.delivery-time-updated=${AISENSY_CAMPAIGN_DELIVERY_TIME_UPDATED:}
shivhub.whatsapp.aisensy.campaigns.loyalty-points-updated=${AISENSY_CAMPAIGN_LOYALTY_POINTS_UPDATED:}
shivhub.whatsapp.aisensy.campaigns.after-sales-updated=${AISENSY_CAMPAIGN_AFTER_SALES_UPDATED:}
shivhub.whatsapp.aisensy.campaigns.support-ticket-received=${AISENSY_CAMPAIGN_SUPPORT_TICKET_RECEIVED:}
shivhub.whatsapp.aisensy.campaigns.support-ticket-updated=${AISENSY_CAMPAIGN_SUPPORT_TICKET_UPDATED:}
shivhub.whatsapp.aisensy.campaigns.offer-notification=${AISENSY_CAMPAIGN_OFFER_NOTIFICATION:}
shivhub.whatsapp.aisensy.campaigns.seller-account-approved=${AISENSY_CAMPAIGN_SELLER_ACCOUNT_APPROVED:}
shivhub.whatsapp.aisensy.campaigns.seller-account-rejected=${AISENSY_CAMPAIGN_SELLER_ACCOUNT_REJECTED:}
shivhub.whatsapp.aisensy.campaigns.seller-product-approved=${AISENSY_CAMPAIGN_SELLER_PRODUCT_APPROVED:}
shivhub.whatsapp.aisensy.campaigns.seller-product-rejected=${AISENSY_CAMPAIGN_SELLER_PRODUCT_REJECTED:}
shivhub.whatsapp.aisensy.campaigns.seller-payment-reminder=${AISENSY_CAMPAIGN_SELLER_PAYMENT_REMINDER:}
shivhub.whatsapp.aisensy.campaigns.seller-purchase-invoice=${AISENSY_CAMPAIGN_SELLER_PURCHASE_INVOICE:}
shivhub.whatsapp.aisensy.campaigns.seller-purchase-payment=${AISENSY_CAMPAIGN_SELLER_PURCHASE_PAYMENT:}
shivhub.whatsapp.aisensy.campaigns.seller-low-stock=${AISENSY_CAMPAIGN_SELLER_LOW_STOCK:}
shivhub.whatsapp.aisensy.campaigns.seller-expense-recorded=${AISENSY_CAMPAIGN_SELLER_EXPENSE_RECORDED:}
shivhub.whatsapp.aisensy.campaigns.seller-subscription-updated=${AISENSY_CAMPAIGN_SELLER_SUBSCRIPTION_UPDATED:}
shivhub.whatsapp.aisensy.campaigns.staff-account-assigned=${AISENSY_CAMPAIGN_STAFF_ACCOUNT_ASSIGNED:}
shivhub.whatsapp.aisensy.campaigns.distributor-workflow-updated=${AISENSY_CAMPAIGN_DISTRIBUTOR_WORKFLOW_UPDATED:}
shivhub.whatsapp.aisensy.campaigns.distributor-payment-recorded=${AISENSY_CAMPAIGN_DISTRIBUTOR_PAYMENT_RECORDED:}
shivhub.whatsapp.aisensy.campaigns.referral-invitation=${AISENSY_CAMPAIGN_REFERRAL_INVITATION:}
shivhub.whatsapp.aisensy.campaigns.emi-schedule=${AISENSY_CAMPAIGN_EMI_SCHEDULE:}
shivhub.whatsapp.aisensy.campaigns.emi-reminder=${AISENSY_CAMPAIGN_EMI_REMINDER:}
shivhub.whatsapp.aisensy.campaigns.emi-overdue=${AISENSY_CAMPAIGN_EMI_OVERDUE:}
shivhub.whatsapp.aisensy.campaigns.marketplace-listing-submitted=${AISENSY_CAMPAIGN_MARKETPLACE_LISTING_SUBMITTED:}
shivhub.whatsapp.aisensy.campaigns.marketplace-listing-approved=${AISENSY_CAMPAIGN_MARKETPLACE_LISTING_APPROVED:}
shivhub.whatsapp.aisensy.campaigns.marketplace-listing-rejected=${AISENSY_CAMPAIGN_MARKETPLACE_LISTING_REJECTED:}
shivhub.whatsapp.aisensy.campaigns.marketplace-enquiry=${AISENSY_CAMPAIGN_MARKETPLACE_ENQUIRY:}
shivhub.whatsapp.aisensy.campaigns.marketplace-item-sold=${AISENSY_CAMPAIGN_MARKETPLACE_ITEM_SOLD:}
shivhub.whatsapp.aisensy.campaigns.marketplace-listing-expired=${AISENSY_CAMPAIGN_MARKETPLACE_LISTING_EXPIRED:}
shivhub.whatsapp.aisensy.campaigns.marketplace-listing-archived=${AISENSY_CAMPAIGN_MARKETPLACE_LISTING_ARCHIVED:}


# =========================================================
# EMAIL CONFIGURATION
# =========================================================

spring.mail.host=smtp.gmail.com
spring.mail.port=587

# Gmail sender email
spring.mail.username=${SHIVHUB_MAIL_USERNAME:}

# Gmail App Password
spring.mail.password=${SHIVHUB_MAIL_PASSWORD:}
# SMTP AUTHENTICATION
# =========================================================

spring.mail.properties.mail.smtp.auth=true


# =========================================================
# SMTP TLS SECURITY
# =========================================================

spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true


# =========================================================
# EMAIL CONNECTION TEST
# =========================================================

spring.mail.test-connection=${SHIVHUB_MAIL_TEST_CONNECTION:false}


# =========================================================
# EMAIL DEBUG
# =========================================================

spring.mail.properties.mail.debug=${SHIVHUB_MAIL_DEBUG:false}


# =========================================================
# SMTP TIMEOUTS
# =========================================================

spring.mail.properties.mail.smtp.connectiontimeout=10000
spring.mail.properties.mail.smtp.timeout=10000
spring.mail.properties.mail.smtp.writetimeout=10000

# Daily seller payment summary: cron is evaluated in Asia/Kolkata and contains no credentials.
shivhub.reminders.zone=${SHIVHUB_REMINDER_ZONE:Asia/Kolkata}
shivhub.reminders.seller-payment-cron=${SHIVHUB_SELLER_REMINDER_CRON:0 0 8 * * *}
shivhub.reminders.send-empty=${SHIVHUB_REMINDER_SEND_EMPTY:false}
shivhub.reminders.dashboard-url=${SHIVHUB_SELLER_DASHBOARD_URL:http://localhost:5173/seller/dashboard}

# Finance customer EMI reminder task. It runs daily at 08:00 Asia/Kolkata by
# default and sends a single email exactly two days before each active due date.
shivhub.finance.reminder-cron=${SHIVHUB_FINANCE_REMINDER_CRON:0 0 8 * * *}

# Daily marketing birthday task. SMTP credentials remain environment-only above.
shivhub.birthday.zone=${SHIVHUB_BIRTHDAY_ZONE:Asia/Kolkata}
shivhub.birthday.cron=${SHIVHUB_BIRTHDAY_CRON:0 0 10 * * *}


# =========================================================
# MOBILE SPECIFICATIONS API
# =========================================================

# Add the licensed provider endpoint here after purchase.
# Example:
# mobile.spec.api.base-url=https://provider.example.com/mobile/specs/search
# mobile.spec.api.key=YOUR_PROVIDER_KEY
# mobile.spec.api.provider=GSMARENA

mobile.spec.api.base-url=${SHIVHUB_MOBILE_SPEC_API_BASE_URL:}
mobile.spec.api.key=${SHIVHUB_MOBILE_SPEC_API_KEY:}
mobile.spec.api.provider=GSMARENA


# =========================================================
# CUSTOMER SOCIAL LOGIN
# =========================================================

# Google OAuth Client ID
shivhub.oauth.google.client-id=${SHIVHUB_GOOGLE_CLIENT_ID:}

# Facebook OAuth App ID
shivhub.oauth.facebook.app-id=${SHIVHUB_FACEBOOK_APP_ID:}
